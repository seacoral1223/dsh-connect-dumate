# 把本机登录的百度搭子（DuMate）接进 DSH 的模型选择器，并给一套只读积分读数。
# 默认 mode: auto —— 优先走云端模型网关（**搭子 App 不用开着**）；
# 拿不到网关 token 时才退回 App 自带的本地代理。改成 local 可强制只走 App。
- insert:
    - id: dsh-connect-dumate
      name: dsh-connect-dumate
      config:
        enabled: true
        providerId: dumate
        mode: auto
        # 积分读数刷新间隔（毫秒），只认 60000 / 300000 / 600000 / 1800000 / 3600000
        pollIntervalMs: 300000
